name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            artifact: tcp-port-linux-amd64
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: tcp-port-linux-arm64
            ext: ""
          - os: darwin
            arch: amd64
            runner: macos-13
            artifact: tcp-port-darwin-amd64
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            artifact: tcp-port-darwin-arm64
            ext: ""
          # Windows requires Npcap SDK; download from https://npcap.com/#download
          # Build manually: GOOS=windows CGO_ENABLED=1 CGO_LDFLAGS="-L/path/to/npcap-sdk/Lib/x64" go build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install libpcap (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install libpcap (macOS)
        if: matrix.os == 'darwin'
        run: brew install libpcap

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o "${{ matrix.artifact }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tcp-port-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
