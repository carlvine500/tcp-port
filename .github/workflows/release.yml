name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            artifact: tcp-port-linux-amd64
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: tcp-port-linux-arm64
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            artifact: tcp-port-darwin-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install libpcap (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install libpcap (macOS)
        if: matrix.os == 'darwin'
        run: brew install libpcap

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o "${{ matrix.artifact }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  centos7:
    name: Build CentOS 7 (glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in CentOS 7 container
        run: |
          cat > Dockerfile.centos7 << 'DOCKEREOF'
          FROM centos:7
          # CentOS 7 EOL — use vault archives
          RUN sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*.repo && \
              sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo && \
              yum install -y epel-release && \
              sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/epel*.repo && \
              sed -i 's|#baseurl|baseurl|g' /etc/yum.repos.d/epel*.repo && \
              sed -i 's|download.fedoraproject.org/pub|archives.fedoraproject.org/pub/archive|g' /etc/yum.repos.d/epel*.repo && \
              yum install -y libpcap-devel gcc make && \
              yum clean all
          RUN curl -fsSL https://go.dev/dl/go1.22.10.linux-amd64.tar.gz | tar -C /usr/local -xz
          ENV PATH="/usr/local/go/bin:$PATH"
          WORKDIR /build
          COPY . .
          RUN CGO_ENABLED=1 go build -ldflags="-s -w" -o tcp-port-centos7 .
          DOCKEREOF
          docker build -f Dockerfile.centos7 -t tcp-port-centos7 .
          docker create --name tmp tcp-port-centos7
          docker cp tmp:/build/tcp-port-centos7 ./tcp-port-linux-amd64-centos7
          docker rm tmp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-port-linux-amd64-centos7
          path: tcp-port-linux-amd64-centos7

  release:
    name: Create Release
    needs: [build, centos7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tcp-port-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
